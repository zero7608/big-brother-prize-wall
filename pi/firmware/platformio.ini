; Build both wireless units:
;
;     cd firmware
;     pio run                  # both
;     pio run -e nicenano      # just the nRF52840
;     pio run -t upload -e esp32c6
;
; One sketch serves both: it picks NimBLE or Bluefruit from the architecture
; macro, so the difference lives in the firmware rather than in two files that
; drift apart.

[platformio]
src_dir = prize_reader_ble

[env]
framework = arduino
lib_deps = adafruit/Adafruit PN532@^1.3.0
build_flags = -Wall

;
; Nice!Nano V2 and its SuperMini clones. There is no "nicenano" board id in
; this platform: the board runs the Adafruit nRF52 bootloader, so it is built
; as a Feather nRF52840 Express, which is also what the Arduino IDE is told to
; select.
;
; That gets the chip, the core and the bootloader right. It does NOT get the
; pin numbering right, because the two boards label their pins differently, so
; the button pin is set explicitly below rather than left to the variant.
[env:nicenano]
platform = nordicnrf52
board = adafruit_feather_nrf52840
build_flags = -Wall -D BUTTON_PIN=6

; ESP32-C6. The official espressif32 platform did not know this chip for a
; long time; the pioarduino fork tracks Arduino core 3.x, which does.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-c6-devkitc-1
build_flags = -Wall -D BUTTON_PIN=4
lib_deps =
    adafruit/Adafruit PN532@^1.3.0
    h2zero/NimBLE-Arduino@^1.4.2
